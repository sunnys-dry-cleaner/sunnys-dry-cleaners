name: Check and deploy site

# Runs every time something is pushed or uploaded to main
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Download the site's files onto GitHub's test machine
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Broken tags, missing images, links to sections that don't exist
      - name: Check HTML, links and images
        run: python tests/check_files.py

      # Load the page in a pretend browser and make sure the JavaScript works
      - name: Install pretend browser
        run: npm install --no-save --no-package-lock jsdom@30.1.1

      - name: Check the page's JavaScript
        run: node tests/check_page.mjs

  # Only runs if every check above passed
  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
